# Test suites and the web build, run on every pull request to main, every push
# to main and the merge queue. The job names (server-tests, orchestrator-tests,
# agent-tests, web-build) are the required status checks on main, so renaming a
# job means updating branch protection too.
#
# No secrets: every vendor is mocked in the tests. DATABASE_URL is set in every
# job so load_dotenv() can never fill it from a .env (none is committed; see
# .gitignore), and server/conftest.py and agent/conftest.py refuse a Railway
# database outright.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Production runs Postgres 18 (Railway postgres-ssl:18.6).
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: vistrow
          POSTGRES_PASSWORD: vistrow
          POSTGRES_DB: vistrow_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vistrow -d vistrow_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://vistrow:vistrow@localhost:5432/vistrow_tests
      TEST_DATABASE_URL: postgresql://vistrow:vistrow@localhost:5432/vistrow_tests
      DISABLE_CAMPAIGN_DIALER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # Dockerfile: python:3.12-slim
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: test ! -e .env
      - run: pip install -r server/requirements.txt pytest
      - run: python -m pytest server -q

  orchestrator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://localhost:1/placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # orchestrator/Dockerfile: python:3.12-slim
          cache: pip
          cache-dependency-path: orchestrator/requirements.txt
      - run: test ! -e .env
      - run: pip install -r orchestrator/requirements.txt pytest
      - run: python -m pytest orchestrator -q

  agent-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: postgresql://localhost:1/placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # agent/Dockerfile: PYTHON_VERSION=3.12
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - run: test ! -e .env
      - run: pip install -r agent/requirements.txt pytest
      - run: python -m pytest agent -q --durations=10

  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web-demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # web-demo/Dockerfile.staging: node:22-slim
          cache: npm
          cache-dependency-path: web-demo/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test:seo
      # Added by the voice-clone work; skipped until that script is on main.
      - run: npm run --if-present test:voice-clone
