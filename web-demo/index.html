<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <!-- Theme before first paint: the same rule as src/lib/theme.ts
         (stored 'av-theme' of 'dark' means dark, anything else or no
         storage means light), so prerendered pages don't flash the dark
         default tokens until main.tsx runs. data-theme="light" on <html>
         covers visitors without JavaScript. If this script changes, update
         its sha256 in vercel.json's Content-Security-Policy-Report-Only. -->
    <script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('av-theme')==='dark'?'dark':'light')}catch(e){document.documentElement.setAttribute('data-theme','light')}</script>
    <!-- A single dark-badge mark (self-contained square background, not a
         transparent glyph) reads fine against both light and dark browser
         chrome, so one icon covers both - no more theme-matched variants. -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google tag (gtag.js), loaded only after the visitor accepts
         analytics cookies (src/lib/analyticsConsent.ts, banner in
         AnalyticsConsentBanner.tsx). Consent Mode v2 defaults are all
         denied; a stored "granted" loads the tag here so page views count
         from the first page. send_page_view is off because this is a
         client-side-routed SPA - page views fire through
         src/lib/analytics.ts. If this script changes, update its sha256 in
         vercel.json's Content-Security-Policy-Report-Only. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      var vvAnalytics = null;
      try { vvAnalytics = localStorage.getItem('vv-analytics-consent'); } catch (e) {}
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: vvAnalytics === 'granted' ? 'granted' : 'denied'
      });
      gtag('js', new Date());
      gtag('config', 'G-YSY7Z22NS2', { send_page_view: false });
      if (vvAnalytics === 'granted') {
        var vvGa = document.createElement('script');
        vvGa.async = true;
        vvGa.src = 'https://www.googletagmanager.com/gtag/js?id=G-YSY7Z22NS2';
        vvGa.setAttribute('data-vv-ga', '');
        document.head.appendChild(vvGa);
      }
    </script>
    <link rel="preload" href="/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin />

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Vistrow's own embeddable call widget ("Our Marketing Website" site
         key in the dashboard's Website Widget page), dogfooded on
         vistrowvoice.com itself alongside the homepage hero's inline
         DemoOrbCard - a separate, bottom-right floating "Talk to us"
         button available on every page, not just the homepage.

         Routed through Vercel's existing /api/* rewrite (vercel.json,
         already proxying to this same Railway backend for the dashboard)
         instead of hitting voice-production-2950.up.railway.app directly -
         confirmed live that requesting the Railway domain directly, as a
         cross-origin <script src> FROM vistrowvoice.com specifically,
         returns 503 at Railway's edge (other customers' embeds work fine;
         a direct top-level navigation to the same URL also works fine -
         it's specific to that cross-origin subresource pattern from this
         referrer). Same-origin via /api sidesteps whatever that edge rule
         is entirely; confirmed working (200, full bundle) before shipping.
         Third-party embed snippets from the dashboard still point
         customers directly at the Railway URL, since they don't have this
         proxy - this fix is only relevant for our own site.

         This one index.html serves both vistrowvoice.com (marketing) and
         app.vistrowvoice.com (the dashboard app itself, see hostBuckets.ts)
         - a plain <script> tag here would load on both, so the floating
         button showed up while using the dashboard too. Gated behind a
         hostname check so it only ever loads on the marketing site (not
         the app, and not admin.vistrowvoice.com). -->
    <script>
      if (location.hostname.indexOf('app.') !== 0 && location.hostname.indexOf('admin.') !== 0) {
        var vistrowWidgetScript = document.createElement('script')
        vistrowWidgetScript.src = '/api/widget.js'
        vistrowWidgetScript.setAttribute('data-site-key', 'av_live_K3WlEka3sKGHgFA-xwQrijJsTO8XfqhK')
        vistrowWidgetScript.setAttribute('data-api-base', '/api')
        vistrowWidgetScript.setAttribute('data-position', 'bottom-right')
        vistrowWidgetScript.setAttribute('data-label', 'Talk to us')
        vistrowWidgetScript.setAttribute('data-agent-name', 'Artha')
        vistrowWidgetScript.setAttribute('data-mode', 'both')
        vistrowWidgetScript.setAttribute('data-cta-label', 'Book a demo')
        vistrowWidgetScript.setAttribute('data-cta-url', 'https://www.vistrowvoice.com/contact')
        // Use the same Artha identity as the dashboard help assistant. The
        // widget's live site config refresh keeps this value in sync with
        // the Website Widget settings after the first render.
        vistrowWidgetScript.setAttribute('data-avatar', 'artha')
        document.body.appendChild(vistrowWidgetScript)
      }
    </script>
  </body>
