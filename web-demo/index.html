         chrome, so one icon covers both - no more theme-matched variants. -->

    />

    <link rel="canonical" href="https://vistrowvoice.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vistrow Voice" />

    <!-- Google tag (gtag.js). send_page_view is off because this is a
         client-side-routed SPA - the initial load and every in-app
         navigation both fire through src/lib/analytics.ts instead, so
         Home -> Pricing -> Contact are three page_views, not one. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-YSY7Z22NS2"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag('js', new Date());
      gtag('config', 'G-YSY7Z22NS2', { send_page_view: false });
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
  </head>

         vistrowvoice.com itself alongside the homepage hero's inline
         DemoOrbCard - a separate, bottom-right floating "Talk to us"
         button available on every page, not just the homepage. -->
    <script
      src="https://voice-production-2950.up.railway.app/widget.js"
