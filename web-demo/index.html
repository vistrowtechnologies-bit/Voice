    <!-- Vistrow's own embeddable call widget ("Our Marketing Website" site
         key in the dashboard's Website Widget page), dogfooded on
         vistrowvoice.com itself alongside the homepage hero's inline
         DemoOrbCard - a separate, bottom-right floating "Talk to us"
         button available on every page, not just the homepage.

         Routed through Vercel's existing /api/* rewrite (vercel.json,
         already proxying to this same Railway backend for the dashboard)
         instead of hitting voice-production-2950.up.railway.app directly -
         confirmed live that requesting the Railway domain directly, as a
         cross-origin <script src> FROM vistrowvoice.com specifically,
         returns 503 at Railway's edge (other customers' embeds work fine;
         a direct top-level navigation to the same URL also works fine -
         it's specific to that cross-origin subresource pattern from this
         referrer). Same-origin via /api sidesteps whatever that edge rule
         is entirely; confirmed working (200, full bundle) before shipping.
         Third-party embed snippets from the dashboard still point
         customers directly at the Railway URL, since they don't have this
         proxy - this fix is only relevant for our own site.

         This one index.html serves both vistrowvoice.com (marketing) and
         app.vistrowvoice.com (the dashboard app itself, see hostBuckets.ts)
         - a plain <script> tag here would load on both, so the floating
         button showed up while using the dashboard too. Gated behind a
         hostname check so it only ever loads on the marketing site. -->
    <script>
      if (location.hostname.indexOf('app.') !== 0) {
        var vistrowWidgetScript = document.createElement('script')
        vistrowWidgetScript.src = '/api/widget.js'
        vistrowWidgetScript.setAttribute('data-site-key', 'av_live_K3WlEka3sKGHgFA-xwQrijJsTO8XfqhK')
        vistrowWidgetScript.setAttribute('data-api-base', '/api')
        vistrowWidgetScript.setAttribute('data-position', 'bottom-right')
        vistrowWidgetScript.setAttribute('data-label', 'Talk to us')
        vistrowWidgetScript.setAttribute('data-agent-name', 'Artha')
        vistrowWidgetScript.setAttribute('data-mode', 'both')
        vistrowWidgetScript.setAttribute('data-cta-label', 'Book a demo')
        vistrowWidgetScript.setAttribute('data-cta-url', 'https://www.vistrowvoice.com/contact')
        // Use the same Artha identity as the dashboard help assistant. The
        // widget's live site config refresh keeps this value in sync with
        // the Website Widget settings after the first render.
        vistrowWidgetScript.setAttribute('data-avatar', 'artha')
        document.body.appendChild(vistrowWidgetScript)
      }
    </script>
