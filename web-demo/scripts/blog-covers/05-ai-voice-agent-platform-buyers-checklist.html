<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Cover 5 checklist board</title><style>@font-face{font-family:Sora;src:url(../../public/fonts/sora-latin.woff2) format('woff2');font-weight:100 900}
@font-face{font-family:Manrope;src:url(../../public/fonts/manrope-latin.woff2) format('woff2');font-weight:200 800}
*{box-sizing:border-box;margin:0;padding:0} html,body{width:1200px;height:675px;overflow:hidden} body{font-family:Manrope,sans-serif;position:relative}
body{background:linear-gradient(135deg,#faf5ff 0%,#f3e8ff 60%,#ede9fe 100%)}

.brand{position:absolute;top:44px;left:60px;display:flex;align-items:center;gap:10px;font-family:Sora;font-weight:700;font-size:20px;color:#1e0b3a} .brand img{width:34px;height:34px;border-radius:9px}
.text{position:absolute;left:60px;top:150px;width:470px}

p{margin-top:16px;font-size:23px;color:#5b4b70;font-weight:600}
.board{position:absolute;left:600px;top:120px;width:520px;background:#fff;border-radius:28px;padding:34px 34px 30px;box-shadow:0 30px 70px rgba(88,28,135,.22);transform:rotate(-2deg)}
.board h2{font-family:Sora;font-size:16px;letter-spacing:.16em;color:#7e22ce} ul{list-style:none;margin-top:16px}

.t{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#9333ea,#c026d3);display:grid;place-items:center;flex:none}
.face{position:absolute;right:46px;top:34px;width:150px;height:150px;border-radius:50%;background:url(people/colleagues-review-scene.jpg) 64% 22%/360% no-repeat;border:6px solid #fff;box-shadow:0 0 0 4px #c084fc,0 20px 40px rgba(88,28,135,.25)}
