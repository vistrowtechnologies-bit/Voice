<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Cover 11 quote card EMI reminders</title><style>@font-face{font-family:Sora;src:url(../../public/fonts/sora-latin.woff2) format('woff2');font-weight:100 900}
