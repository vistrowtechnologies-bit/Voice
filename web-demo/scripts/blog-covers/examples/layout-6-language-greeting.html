<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Layout 6 example: language greeting</title><style>@font-face{font-family:Sora;src:url(../../../public/fonts/sora-latin.woff2) format('woff2');font-weight:100 900}
@font-face{font-family:Manrope;src:url(../../../public/fonts/manrope-latin.woff2) format('woff2');font-weight:200 800}
*{box-sizing:border-box;margin:0;padding:0} html,body{width:1200px;height:675px;overflow:hidden} body{font-family:Manrope,sans-serif;position:relative}
body{background:linear-gradient(120deg,#fff7ed 0%,#fdf2f8 45%,#f3e8ff 100%)}
.photo{position:absolute;right:0;top:0;width:560px;height:675px;background:url(../people/artha-front-desk-scene.jpg) 72% center/cover;-webkit-mask-image:linear-gradient(to right,transparent 0%,#000 32%)}
.brand{position:absolute;top:42px;left:60px;display:flex;align-items:center;gap:10px;font-family:Sora;font-weight:700;font-size:19px;color:#1e0b3a} .brand img{width:32px;height:32px;border-radius:8px}
.greet{position:absolute;left:52px;top:96px;font-family:'Kohinoor Devanagari','Noto Sans Devanagari','Devanagari Sangam MN',sans-serif;font-weight:700;font-size:168px;line-height:1.1;color:#9333ea;letter-spacing:-.01em}
.text{position:absolute;left:60px;top:330px;width:600px}
.pill{display:inline-block;font-family:Sora;font-weight:700;font-size:13px;letter-spacing:.16em;color:#fff;background:#1e0b3a;padding:7px 13px;border-radius:999px}
h1{font-family:Sora;font-weight:800;font-size:56px;line-height:1.03;letter-spacing:-.035em;color:#1a0b2e;margin-top:14px}
p{margin-top:12px;font-size:22px;color:#5b4b70;font-weight:600}
.chips{display:flex;gap:10px;margin-top:20px} .chip{font-weight:700;font-size:17px;padding:9px 15px;border-radius:999px;background:#fff;color:#4c1d95;box-shadow:0 6px 18px rgba(88,28,135,.12)}
</style></head><body><div class="photo"></div><div class="brand"><img src="../../../src/assets/vistrow-mark.png" alt=""> Vistrow Voice</div><div class="greet">नमस्ते</div><div class="text"><span class="pill">LANGUAGE</span><h1>Hindi AI voice agent</h1><p>Natural Hindi and Hinglish on every call</p><div class="chips"><span class="chip">Bookings</span><span class="chip">Follow-ups</span><span class="chip">Hinglish</span></div></div></body></html>
