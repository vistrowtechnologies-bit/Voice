<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Layout 7 example: quote or stat card</title><style>@font-face{font-family:Sora;src:url(../../../public/fonts/sora-latin.woff2) format('woff2');font-weight:100 900}
@font-face{font-family:Manrope;src:url(../../../public/fonts/manrope-latin.woff2) format('woff2');font-weight:200 800}
*{box-sizing:border-box;margin:0;padding:0} html,body{width:1200px;height:675px;overflow:hidden} body{font-family:Manrope,sans-serif;position:relative}
body{background:#9333ea;background:linear-gradient(135deg,#7e22ce 0%,#9333ea 50%,#c026d3 100%)}
.ring{position:absolute;right:-120px;top:-120px;width:520px;height:520px;border-radius:50%;border:2px solid rgba(255,255,255,.18)}
.ring2{position:absolute;right:-40px;top:-40px;width:360px;height:360px;border-radius:50%;border:2px solid rgba(255,255,255,.14)}
