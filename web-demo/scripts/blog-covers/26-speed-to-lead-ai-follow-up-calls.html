<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Cover 26 phone mock speed to lead</title><style>@font-face{font-family:Sora;src:url(../../public/fonts/sora-latin.woff2) format('woff2');font-weight:100 900}
@font-face{font-family:Manrope;src:url(../../public/fonts/manrope-latin.woff2) format('woff2');font-weight:200 800}
*{box-sizing:border-box;margin:0;padding:0} html,body{width:1200px;height:675px;overflow:hidden} body{font-family:Manrope,sans-serif;position:relative}
.photo{position:absolute;inset:0;background:url(people/new-lead-callback-sofa-scene.jpg) 20% center/cover}
.shade{position:absolute;inset:0;background:linear-gradient(0deg,rgba(26,8,40,.92) 0%,rgba(26,8,40,.55) 36%,transparent 60%),linear-gradient(90deg,transparent 55%,rgba(26,8,40,.35) 100%)}
.brand{position:absolute;top:40px;left:52px;display:flex;align-items:center;gap:10px;font-family:Sora;font-weight:700;font-size:19px;color:#fff;background:rgba(26,8,40,.55);padding:8px 14px 8px 8px;border-radius:999px} .brand img{width:30px;height:30px;border-radius:8px}
.text{position:absolute;left:52px;bottom:48px;width:660px;color:#fff}
.pill{display:inline-block;font-family:Sora;font-weight:700;font-size:13px;letter-spacing:.16em;color:#fff;background:rgba(147,51,234,.9);padding:7px 13px;border-radius:999px}
h1{font-family:Sora;font-weight:800;font-size:58px;line-height:1.03;letter-spacing:-.035em;margin-top:14px} h1 em{font-style:normal;color:#f0abfc}
p{margin-top:10px;font-size:22px;font-weight:600;color:#f3e8ff}
.phone{position:absolute;right:70px;top:46px;width:290px;height:585px;border-radius:44px;background:#0b0614;padding:12px;box-shadow:0 40px 90px rgba(0,0,0,.5),0 0 0 2px rgba(255,255,255,.12)}
.screen{width:100%;height:100%;border-radius:34px;background:linear-gradient(180deg,#2a0f52,#12061f);color:#fff;padding:22px 16px 16px;text-align:center;position:relative}
.lead{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:10px 12px;text-align:left}
.lead .ic{width:34px;height:34px;border-radius:10px;background:rgba(216,180,254,.22);display:grid;place-items:center;flex:none}
.lead b{display:block;font-family:Sora;font-size:14px} .lead span{display:block;font-size:12px;color:#d8b4fe;font-weight:600}
.timer{display:inline-flex;align-items:center;gap:7px;margin-top:14px;background:#f5d0fe;color:#3b0764;font-family:Sora;font-weight:700;font-size:13px;padding:6px 12px;border-radius:999px}
.screen img{width:86px;height:86px;border-radius:50%;border:3px solid #d8b4fe;object-fit:cover;margin:18px auto 0;display:block}
.screen h3{font-family:Sora;font-size:22px;margin-top:8px} .screen .r{font-size:14px;color:#e9d5ff;margin-top:2px}
.wv{margin-top:12px}
.ok{position:absolute;left:14px;right:14px;bottom:16px;background:#fff;color:#1a0b2e;border-radius:20px;padding:14px 16px;text-align:left}
.ok b{display:flex;align-items:center;gap:8px;font-family:Sora;font-size:17px} .ok .c{width:24px;height:24px;border-radius:50%;background:#22c55e;display:grid;place-items:center}
.ok span{display:block;font-size:13.5px;color:#5b4b70;margin-top:6px;font-weight:600}
.qs{display:flex;gap:6px;justify-content:center;margin-top:12px}.qs span{font-size:12.5px;font-weight:700;color:#f3e8ff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);padding:5px 9px;border-radius:999px}</style></head><body><div class="photo"></div><div class="shade"></div><div class="brand"><img src="../../src/assets/vistrow-mark.png" alt=""> Vistrow Voice</div><div class="text"><span class="pill">HOW-TO</span><h1>Speed to lead<br>with <em>AI calls</em></h1><p>Call new leads back within minutes, not days</p></div><div class="phone"><div class="screen"><div class="lead"><span class="ic"><svg width="18" height="20" viewBox="0 0 18 20" fill="none" stroke="#f3e8ff" stroke-width="2" stroke-linecap="round"><rect x="1.5" y="1.5" width="15" height="17" rx="3"/><path d="M5 7h8M5 11h8M5 15h5"/></svg></span><div><b>New enquiry form</b><span>Lead received</span></div></div><div class="timer"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#3b0764" stroke-width="2.6" stroke-linecap="round"><circle cx="12" cy="13.5" r="8"/><path d="M12 9.5v4l2.5 2M9.5 2.5h5"/></svg>Calling now</div><img src="people/artha-avatar.webp" alt=""><h3>Artha</h3><div class="r">AI voice agent</div><div class="wv"><svg width="70" height="30" viewBox="0 0 70 30" fill="#a855f7"><rect x="0" y="11" width="5" height="8" rx="2.5"/><rect x="9" y="6" width="5" height="18" rx="2.5"/><rect x="18" y="0" width="5" height="30" rx="2.5"/><rect x="27" y="5" width="5" height="20" rx="2.5"/><rect x="36" y="9" width="5" height="12" rx="2.5"/><rect x="45" y="3" width="5" height="24" rx="2.5"/><rect x="54" y="8" width="5" height="14" rx="2.5"/><rect x="63" y="11" width="5" height="8" rx="2.5"/></svg></div><div class="qs"><span>Need</span><span>Budget</span><span>Timing</span></div><div class="ok"><b><span class="c"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>Lead qualified</b><span>Budget and timing sent to CRM</span></div></div></div></body></html>
