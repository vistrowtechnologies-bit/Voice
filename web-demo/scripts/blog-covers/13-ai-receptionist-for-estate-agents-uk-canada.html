<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cover: AI receptionist for estate agents in the UK and Canada</title>
<style>
  @font-face { font-family: Sora; src: url(../../public/fonts/sora-latin.woff2) format('woff2'); font-weight: 100 900; }
  @font-face { font-family: Manrope; src: url(../../public/fonts/manrope-latin.woff2) format('woff2'); font-weight: 200 800; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 675px; overflow: hidden; }
  body {
    font-family: Manrope, sans-serif; color: #fff;
    background:
      radial-gradient(700px 500px at 88% 18%, rgba(168, 85, 247, .45), transparent 60%),
      radial-gradient(600px 420px at 8% 100%, rgba(217, 70, 239, .28), transparent 60%),
      linear-gradient(135deg, #12061f 0%, #1e0b3a 55%, #2a0f52 100%);
    position: relative;
  }
  .grain { position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px); background-size: 22px 22px; opacity: .5; }
  .wrap { position: absolute; inset: 0; padding: 56px 60px; display: grid; grid-template-columns: 470px 1fr; gap: 40px; align-items: center; }
  .brand { position: absolute; top: 44px; left: 60px; display: flex; align-items: center; gap: 12px; font-family: Sora; font-weight: 700; font-size: 22px; letter-spacing: -.01em; }
  .brand img { width: 38px; height: 38px; border-radius: 10px; }
  .pill { display: inline-block; font-family: Sora; font-weight: 700; font-size: 15px; letter-spacing: .16em; text-transform: uppercase; color: #e9d5ff; background: rgba(168, 85, 247, .22); border: 1px solid rgba(216, 180, 254, .35); padding: 9px 16px; border-radius: 999px; }
  h1 { font-family: Sora; font-weight: 800; font-size: 58px; line-height: 1.04; letter-spacing: -.035em; margin-top: 22px; }
  h1 em { font-style: normal; color: #d8b4fe; }
  .sub { margin-top: 20px; font-size: 25px; line-height: 1.35; color: #d4c4ea; font-weight: 500; max-width: 440px; }

  .person { position: absolute; right: -10px; bottom: 0; height: 675px; width: 540px; background: url(people/artha-tablet-headset.jpg) center top / cover no-repeat;
    -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 30%, #000 100%), linear-gradient(to top, transparent 0%, #000 18%);
    -webkit-mask-composite: source-in; mask-composite: intersect; }
  .cards { position: absolute; left: 520px; bottom: 54px; width: 380px; display: grid; gap: 12px; }
  .card { position: relative; display: grid; grid-template-columns: 56px 1fr; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 18px; background: rgba(24, 9, 44, .80); border: 1px solid rgba(255,255,255,.14); backdrop-filter: blur(10px); }
  .card .ic { width: 56px; height: 56px; border-radius: 14px; display: grid; place-items: center; background: rgba(255,255,255,.08); }
  .card h2 { font-family: Sora; font-weight: 700; font-size: 21px; letter-spacing: -.01em; }
  .card p { margin-top: 3px; font-size: 16px; color: #c9b8e2; }
  .greet { display: flex; gap: 8px; margin-top: 6px; }
  .greet span { font-family: 'Kohinoor Devanagari', 'Gurmukhi MN', 'Mukta Mahee', 'Devanagari Sangam MN', sans-serif; font-weight: 600; font-size: 19px; padding: 4px 12px; border-radius: 999px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.22); }
  .card.ai { background: linear-gradient(135deg, rgba(147,51,234,.94), rgba(192,38,211,.88)); border-color: rgba(233, 213, 255, .6); box-shadow: 0 0 60px rgba(168, 85, 247, .45); }
  .card.ai .ic { background: rgba(255,255,255,.18); }
  .card.ai p { color: #f3e8ff; }
</style>
</head>
<body>
  <div class="grain"></div>
  <div class="person"></div>
  <div class="brand"><img src="../../src/assets/vistrow-mark.png" alt=""> Vistrow Voice</div>
  <div class="wrap">
    <div>
      <span class="pill">Industry</span>
      <h1>AI receptionist for <em>estate agents</em></h1>
      <p class="sub">UK and Canada:<br>Hindi and Punjabi callers</p>
    </div>
  </div>
  <div class="cards">
    <div class="card">
      <div class="ic">
        <!-- house -->
        <svg width="40" height="40" viewBox="0 0 48 48" fill="none" stroke="#e9d5ff" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round"><path d="M6 22L24 7l18 15"/><path d="M11 19v22h26V19"/><path d="M20 41V29h8v12"/></svg>
      </div>
      <div><h2>Property enquiry</h2><p>"Is the two-bed flat still free?"</p></div>
    </div>
    <div class="card">
      <div class="ic">
        <!-- speech -->
        <svg width="40" height="40" viewBox="0 0 48 48" fill="none" stroke="#e9d5ff" stroke-width="3.6" stroke-linejoin="round"><path d="M8 10h32v22H22l-9 8v-8H8z"/></svg>
      </div>
      <div><h2>Their language</h2><div class="greet"><span>नमस्ते</span><span>ਸਤ ਸ੍ਰੀ ਅਕਾਲ</span></div></div>
    </div>
    <div class="card ai">
      <div class="ic">
        <!-- calendar tick -->
        <svg width="40" height="40" viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="10" width="34" height="31" rx="5"/><path d="M7 19h34M16 6v8M32 6v8"/><path d="M17 30l5 5 9-10"/></svg>
      </div>
      <div><h2>Viewing booked</h2><p>Saturday, 11 am, sent to your team</p></div>
    </div>
  </div>
</body>
</html>
