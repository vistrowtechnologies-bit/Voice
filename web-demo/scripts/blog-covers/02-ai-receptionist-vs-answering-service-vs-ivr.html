<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cover: AI receptionist vs answering service vs IVR</title>
<style>
  @font-face { font-family: Sora; src: url(../../public/fonts/sora-latin.woff2) format('woff2'); font-weight: 100 900; }
  @font-face { font-family: Manrope; src: url(../../public/fonts/manrope-latin.woff2) format('woff2'); font-weight: 200 800; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 675px; overflow: hidden; }
  body {
    font-family: Manrope, sans-serif; color: #fff;
    background:
      radial-gradient(700px 500px at 88% 18%, rgba(168, 85, 247, .45), transparent 60%),
      radial-gradient(600px 420px at 8% 100%, rgba(217, 70, 239, .28), transparent 60%),
      linear-gradient(135deg, #12061f 0%, #1e0b3a 55%, #2a0f52 100%);
    position: relative;
  }
  .grain { position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px); background-size: 22px 22px; opacity: .5; }
  .wrap { position: absolute; inset: 0; padding: 56px 60px; display: grid; grid-template-columns: 500px 1fr; gap: 40px; align-items: center; }
  .brand { position: absolute; top: 44px; left: 60px; display: flex; align-items: center; gap: 12px; font-family: Sora; font-weight: 700; font-size: 22px; letter-spacing: -.01em; }
  .brand img { width: 38px; height: 38px; border-radius: 10px; }
  .pill { display: inline-block; font-family: Sora; font-weight: 700; font-size: 15px; letter-spacing: .16em; text-transform: uppercase; color: #e9d5ff; background: rgba(168, 85, 247, .22); border: 1px solid rgba(216, 180, 254, .35); padding: 9px 16px; border-radius: 999px; }
  h1 { font-family: Sora; font-weight: 800; font-size: 60px; line-height: 1.04; letter-spacing: -.035em; margin-top: 22px; }
  h1 .vs { color: #d8b4fe; font-weight: 600; }
  .sub { margin-top: 20px; font-size: 25px; line-height: 1.35; color: #d4c4ea; font-weight: 500; max-width: 440px; }
  .cards { display: grid; gap: 16px; padding-top: 30px; }
  .card { display: grid; grid-template-columns: 76px 1fr; align-items: center; gap: 20px; padding: 18px 22px; border-radius: 22px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); }
  .card .ic { width: 76px; height: 76px; border-radius: 18px; display: grid; place-items: center; background: rgba(255,255,255,.08); }
  .card h2 { font-family: Sora; font-weight: 700; font-size: 25px; letter-spacing: -.01em; }
  .card p { margin-top: 4px; font-size: 19px; color: #c9b8e2; }
  .card.ai { background: linear-gradient(135deg, rgba(168,85,247,.42), rgba(217,70,239,.30)); border-color: rgba(233, 213, 255, .55); box-shadow: 0 0 60px rgba(168, 85, 247, .45); }
  .card.ai .ic { background: rgba(255,255,255,.18); }
  .card.ai p { color: #f3e8ff; }
  .badge { position: absolute; right: 22px; top: 50%; transform: translateY(-50%); font-family: Sora; font-weight: 700; font-size: 14px; letter-spacing: .1em; color: #2a0f52; background: #f5d0fe; padding: 7px 12px; border-radius: 999px; }
  .card { position: relative; }

  .person { position: absolute; right: -10px; bottom: 0; height: 675px; width: 540px; background: url(people/receptionist-headset.jpg) center top / cover no-repeat;
    -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 30%, #000 100%), linear-gradient(to top, transparent 0%, #000 18%);
    -webkit-mask-composite: source-in; mask-composite: intersect; }
  .wrap { grid-template-columns: 470px 1fr; }
  .cards { position: absolute; left: 520px; bottom: 54px; width: 372px; gap: 12px; padding-top: 0; }
  .card { grid-template-columns: 56px 1fr; gap: 14px; padding: 12px 16px; border-radius: 18px; background: rgba(24, 9, 44, .78); backdrop-filter: blur(10px); }
  .card .ic { width: 56px; height: 56px; border-radius: 14px; }
  .card .ic svg { transform: scale(.78); }
  .card h2 { font-size: 21px; }
  .card p { font-size: 16px; }
  .card.ai { background: linear-gradient(135deg, rgba(147,51,234,.92), rgba(192,38,211,.85)); }
  h1 { font-size: 56px; }
</style>
</head>
<body>
  <div class="grain"></div>
  <div class="person"></div>
  <div class="brand"><img src="../../src/assets/vistrow-mark.png" alt=""> Vistrow Voice</div>
  <div class="wrap">
    <div>
      <span class="pill">Comparison</span>
      <h1>AI receptionist <span class="vs">vs</span> answering service <span class="vs">vs</span> IVR</h1>
      <p class="sub">Which one should answer your business calls?</p>
    </div>
    <div class="cards">
      <div class="card">
        <div class="ic">
          <!-- keypad -->
          <svg width="46" height="46" viewBox="0 0 46 46" fill="#e9d5ff"><g>
            <circle cx="9" cy="8" r="5"/><circle cx="23" cy="8" r="5"/><circle cx="37" cy="8" r="5"/>
            <circle cx="9" cy="23" r="5"/><circle cx="23" cy="23" r="5"/><circle cx="37" cy="23" r="5"/>
            <circle cx="9" cy="38" r="5"/><circle cx="23" cy="38" r="5"/><circle cx="37" cy="38" r="5"/></g></svg>
        </div>
        <div><h2>IVR menu</h2><p>"Press 1 for sales, 2 for support"</p></div>
      </div>
      <div class="card">
        <div class="ic">
          <!-- headset operator -->
          <svg width="48" height="48" viewBox="0 0 48 48" fill="none" stroke="#e9d5ff" stroke-width="3.4" stroke-linecap="round">
            <circle cx="24" cy="19" r="8"/><path d="M10 42c2-8 8-12 14-12s12 4 14 12"/>
            <path d="M12 20a12 12 0 0 1 24 0"/><rect x="9" y="18" width="5" height="9" rx="2.5" fill="#e9d5ff" stroke="none"/><rect x="34" y="18" width="5" height="9" rx="2.5" fill="#e9d5ff" stroke="none"/>
            <path d="M36.5 27c0 4-3 6-8 6"/></svg>
        </div>
        <div><h2>Answering service</h2><p>A person takes a message</p></div>
      </div>
      <div class="card ai">
        <div class="ic">
          <!-- voice waveform -->
          <svg width="50" height="44" viewBox="0 0 50 44" fill="#fff">
            <rect x="2" y="17" width="5" height="10" rx="2.5"/><rect x="11" y="10" width="5" height="24" rx="2.5"/>
            <rect x="20" y="2" width="5" height="40" rx="2.5"/><rect x="29" y="8" width="5" height="28" rx="2.5"/>
            <rect x="38" y="14" width="5" height="16" rx="2.5"/></svg>
        </div>
        <div><h2>AI receptionist</h2><p>Talks, answers and books</p></div>
      </div>
    </div>
  </div>
</body>
</html>
