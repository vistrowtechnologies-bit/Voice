<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Cover 22 light editorial restaurants</title><style>@font-face{font-family:Sora;src:url(../../public/fonts/sora-latin.woff2) format('woff2');font-weight:100 900}
@font-face{font-family:Manrope;src:url(../../public/fonts/manrope-latin.woff2) format('woff2');font-weight:200 800}
*{box-sizing:border-box;margin:0;padding:0} html,body{width:1200px;height:675px;overflow:hidden} body{font-family:Manrope,sans-serif;position:relative}
.photo{position:absolute;inset:0;background:url(people/restaurant-peak-hour.jpg) 70% center/cover}
.card{position:absolute;left:44px;bottom:44px;width:590px;background:#fff;border-radius:30px;padding:28px 34px 28px;box-shadow:0 30px 80px rgba(30,11,58,.28)}
.brand{display:flex;align-items:center;gap:10px;font-family:Sora;font-weight:700;font-size:18px;color:#1e0b3a} .brand img{width:30px;height:30px;border-radius:8px}
.pill{display:inline-block;margin-top:16px;font-family:Sora;font-weight:700;font-size:13px;letter-spacing:.16em;color:#7e22ce;background:#f3e8ff;padding:7px 13px;border-radius:999px}
h1{font-family:Sora;font-weight:800;font-size:52px;line-height:1.04;letter-spacing:-.035em;color:#1a0b2e;margin-top:12px} h1 em{font-style:normal;color:#9333ea}
p{margin-top:10px;font-size:21px;color:#5b4b70;font-weight:600}
.chips{display:flex;gap:10px;margin-top:16px} .chip{display:flex;align-items:center;gap:7px;font-weight:700;font-size:16px;padding:8px 14px;border-radius:999px;background:#f5f3ff;color:#4c1d95}
.chip.on{background:linear-gradient(135deg,#9333ea,#c026d3);color:#fff}
.tag{position:absolute;left:48px;top:48px;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);padding:7px 18px 7px 7px;border-radius:999px;font-family:Sora;font-weight:700;font-size:16px;color:#1e0b3a;box-shadow:0 12px 30px rgba(30,11,58,.2)}
.tag i{width:40px;height:40px;border-radius:50%;background:url(people/artha-avatar.webp) center/cover;border:2px solid #c084fc}
.dot{width:10px;height:10px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 4px rgba(34,197,94,.25)}
</style></head><body><div class="photo"></div><div class="tag"><i></i><span class="dot"></span>Artha is answering the phone</div><div class="card"><div class="brand"><img src="../../src/assets/vistrow-mark.png" alt=""> Vistrow Voice</div><span class="pill">INDUSTRY</span><h1>AI phone ordering for <em>restaurants</em></h1><p>Orders and enquiries, even at peak hour</p><div class="chips"><span class="chip on"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Table request</span><span class="chip">Order noted</span><span class="chip">Timings</span></div></div></body></html>
